# API + MongoDB for local development.
# Usage: docker compose up --build  ->  http://localhost:3333/docs
# Seed demo users: docker compose exec api node dist/scripts/seed.js
name: growth-machine-api

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/growth-machine
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-chars}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3333:3333"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
